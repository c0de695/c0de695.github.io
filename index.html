<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>函数绘图室 · 纸间札记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="graph.css">
</head>
<body class="gapp">

<!-- ================= 顶栏 ================= -->
<header class="gbar">
  <div class="gbar__brand">
    <span class="brand-mark">ƒ(x)</span>
    <span class="brand-text">函数绘图室</span>
  </div>

  <nav class="gbar__modes" id="modeNav">
    <button class="mode-btn active" data-mode="plot">📈 绘图</button>
    <button class="mode-btn" data-mode="assemble">✋ 自由组装</button>
  </nav>

  <div class="gbar__right">
    <a class="gbar__link" href="blog.html">博客</a>
    <a class="gbar__link" href="diary.html">日记</a>
    <a class="gbar__link" href="games.html">小游戏</a>
    <button id="themeBtn" class="icon-btn" title="切换主题">🌙</button>
    <button id="panelToggle" class="icon-btn only-mobile" title="展开面板">☰</button>
  </div>
</header>

<!-- ================= 主体 ================= -->
<div class="gbody">

  <!-- ---------- 左侧功能栏 ---------- -->
  <aside class="panel" id="panel">

    <!-- 函数列表 -->
    <section class="sec">
      <div class="sec__head">
        <h3 class="sec__title">函数列表</h3>
        <button class="mini-btn" id="addExpr">＋ 添加</button>
      </div>
      <div class="expr-list" id="exprList"></div>
      <p class="hint">
        可用：<code>sin cos tan ln log sqrt abs ^ |x| π e</code><br>
        例：<code>2sin(x)/x</code>、<code>x^2-3x+1</code>、<code>abs(x)-2</code>
      </p>
    </section>

    <!-- 自由组装 -->
    <section class="sec sec--assemble" id="assembleSec" hidden>
      <div class="sec__head">
        <h3 class="sec__title">自由组装</h3>
        <span class="tag tag--pink">拖点生成解析式</span>
      </div>
      <p class="hint">
        在右侧网格上 <b>单击</b> 添加端点，<b>拖动</b> 端点改变形状，<b>右键</b> 删除端点。
      </p>
      <div class="row">
        <label class="field">
          <span>拟合次数</span>
          <select id="fitDeg">
            <option value="0">自动</option>
            <option value="1">1 次（直线）</option>
            <option value="2">2 次（抛物线）</option>
            <option value="3">3 次</option>
            <option value="4">4 次</option>
            <option value="5">5 次</option>
          </select>
        </label>
      </div>
      <div class="fitout" id="fitOut">— 还没有端点 —</div>
      <div class="row">
        <button class="btn btn--primary" id="applyFit">应用到函数列表</button>
        <button class="btn btn--ghost" id="clearPts">清空</button>
      </div>
      <div class="pts-info" id="ptsInfo"></div>
    </section>

    <!-- 虚拟键盘 -->
    <section class="sec">
      <div class="sec__head">
        <h3 class="sec__title">虚拟键盘</h3>
        <button class="mini-btn" id="kbToggle">收起</button>
      </div>
      <div class="kb" id="kb"></div>
    </section>

    <!-- 科学计算器 -->
    <section class="sec">
      <div class="sec__head">
        <h3 class="sec__title">科学计算器</h3>
        <button class="mini-btn" id="calcToggle">收起</button>
      </div>
      <div class="calc" id="calc">
        <div class="calc__screen">
          <input id="calcInput" class="calc__input" type="text" placeholder="0" spellcheck="false" autocomplete="off">
          <div class="calc__result" id="calcResult">= 0</div>
        </div>
        <div class="calc__keys" id="calcKeys"></div>
        <div class="calc__history" id="calcHistory"></div>
      </div>
    </section>

  </aside>

  <!-- ---------- 画布区 ---------- -->
  <main class="stage" id="stage">
    <canvas id="plot"></canvas>

    <div class="hud hud--left">
      <div class="hud__coords" id="coords">x = 0, y = 0</div>
      <div class="hud__mode" id="modeHint">滚轮缩放 · 拖拽平移 · 双击复位</div>
    </div>

    <div class="hud hud--right">
      <button class="hud-btn" id="zoomIn" title="放大">＋</button>
      <button class="hud-btn" id="zoomOut" title="缩小">－</button>
      <button class="hud-btn" id="resetView" title="复位">⟲</button>
    </div>

    <div class="toast" id="toast"></div>
  </main>

</div>

<div class="panel-mask" id="panelMask"></div>

<script src="graph.js"></script>
</body>
</html>
