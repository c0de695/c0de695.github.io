<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写日记 · 纸间札记</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .diary-layout { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; align-items: start; }
    .diary-list { display: flex; flex-direction: column; gap: .75rem; }
    .diary-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      cursor: pointer;
      transition: all .2s;
    }
    .diary-item:hover { border-color: var(--neon-blue); transform: translateY(-2px); }
    .diary-item.active { border-color: var(--neon-blue); background: rgba(110,200,255,.08); }
    .diary-item__date { font-family: var(--font-mono); font-size: .75rem; color: var(--neon-pink); }
    .diary-item__title { font-family: var(--font-display); font-weight: 700; font-size: .95rem; margin: .25rem 0; }
    .diary-item__preview { font-size: .82rem; color: var(--text-dim); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .diary-item__actions { display: flex; gap: .5rem; margin-top: .75rem; }
    .diary-item__del { font-family: var(--font-mono); font-size: .7rem; color: var(--text-faint); padding: 2px 8px; border-radius: 5px; border: 1px solid var(--border); }
    .diary-item__del:hover { border-color: var(--neon-pink); color: var(--neon-pink); }

    .diary-editor {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.75rem;
      position: sticky;
      top: 2rem;
    }
    .diary-editor__title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.25rem;
      margin-bottom: 1.25rem;
      color: var(--neon-blue);
    }
    .diary-editor input, .diary-editor textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .85rem 1rem;
      color: var(--text);
      font-family: inherit;
      font-size: .95rem;
      transition: border-color .2s;
    }
    .diary-editor input:focus, .diary-editor textarea:focus { outline: none; border-color: var(--neon-blue); }
    .diary-editor input { margin-bottom: .85rem; font-weight: 700; }
    .diary-editor textarea { resize: vertical; min-height: 300px; line-height: 1.85; margin-bottom: 1rem; }
    .diary-editor__toolbar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .85rem; }
    .mood-btn {
      padding: .25rem .6rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      font-size: .9rem;
      transition: all .2s;
    }
    .mood-btn:hover, .mood-btn.active { border-color: var(--neon-yellow); background: rgba(255,217,61,.1); }
    .diary-editor__actions { display: flex; gap: .75rem; justify-content: flex-end; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-faint); }
    .empty-state__emoji { font-size: 3rem; margin-bottom: 1rem; }
    .diary-badge-new {
      font-family: var(--font-mono); font-size: .7rem; background: var(--neon-pink); color: #fff;
      padding: 2px 8px; border-radius: 10px; margin-left: .5rem;
    }

    @media (max-width: 900px) {
      .diary-layout { grid-template-columns: 1fr; }
      .diary-editor { position: static; }
    }
  </style>
</head>
<body class="app">

  <!-- ============ 侧边栏 ============ -->
  <aside class="sidebar" id="sidebar">
    <button class="sidebar__close" id="sidebarClose">✕</button>
    <div class="profile">
      <div class="profile__avatar"><span class="avatar-emoji">🐙</span></div>
      <div class="profile__info">
        <div class="profile__name">纸间札记</div>
        <div class="profile__tag">一个人的小角落</div>
      </div>
    </div>
    <nav class="side-nav">
      <a href="index.html" class="side-nav__item"><span class="nav-icon">🏠</span><span class="nav-label">首页</span></a>
      <a href="index.html#articles" class="side-nav__item"><span class="nav-icon">📖</span><span class="nav-label">文章</span></a>
      <a href="#" class="side-nav__item active"><span class="nav-icon">✍️</span><span class="nav-label">日记</span><span class="nav-badge" id="diaryCount">0</span></a>
      <a href="games.html" class="side-nav__item"><span class="nav-icon">🎮</span><span class="nav-label">小游戏</span></a>
    </nav>
    <div class="side-footer">
      <button class="theme-btn" id="themeToggle"><span class="theme-icon">🌙</span></button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ============ 主内容 ============ -->
  <main class="main">
    <header class="topbar">
      <button class="topbar__menu" id="sidebarToggle">☰</button>
      <h1 class="topbar__title">✍️ 写日记</h1>
      <button class="topbar__theme" id="themeToggle2">🌙</button>
    </header>

    <div class="section-header">
      <span class="section-num">✦</span>
      <h3 class="section-title">我的日记本</h3>
      <span class="section-line"></span>
    </div>

    <div class="diary-layout">
      <!-- 日记列表 -->
      <div>
        <button id="newEntryBtn" class="btn btn--primary" style="margin-bottom:1rem;width:100%;justify-content:center">
          ＋ 写新日记
        </button>
        <div class="diary-list" id="diaryList"></div>
      </div>

      <!-- 编辑器 -->
      <div class="diary-editor">
        <div class="diary-editor__title" id="editorTitle">新建日记</div>
        <input id="diaryTitle" type="text" placeholder="给今天起个标题..." maxlength="60">
        <div class="diary-editor__toolbar">
          <span style="font-family:var(--font-mono);font-size:.75rem;color:var(--text-dim);align-self:center">心情:</span>
          <button type="button" class="mood-btn" data-mood="✨">✨</button>
          <button type="button" class="mood-btn" data-mood="☕">☕</button>
          <button type="button" class="mood-btn" data-mood="🌧️">🌧️</button>
          <button type="button" class="mood-btn" data-mood="🌈">🌈</button>
          <button type="button" class="mood-btn" data-mood="💤">💤</button>
          <button type="button" class="mood-btn" data-mood="🔥">🔥</button>
          <button type="button" class="mood-btn" data-mood="🍃">🍃</button>
        </div>
        <textarea id="diaryContent" placeholder="今天发生了什么呢..."></textarea>
        <div class="diary-editor__actions">
          <button id="cancelBtn" class="btn btn--ghost" style="padding:.5rem 1rem">取消</button>
          <button id="saveBtn" class="btn btn--primary">💾 保存</button>
        </div>
        <p style="font-family:var(--font-mono);font-size:.72rem;color:var(--text-faint);margin-top:.85rem;text-align:center">
          💡 数据保存在你的浏览器本地，不会上传
        </p>
      </div>
    </div>

    <footer class="footer">
      <div class="footer__pixel">▓ ░ ▒ ▓ ░ ▒ ▓ ░ ▒ ▓ ░ ▒ ▓ ░ ▒ ▓</div>
      <p class="footer__text">© 2026 纸间札记 · v2.0</p>
    </footer>
  </main>

  <script src="script.js"></script>
  <script>
    /* ---------- Diary App ---------- */
    (function() {
      const STORAGE = 'diary-entries';
      const listEl = document.getElementById('diaryList');
      const titleInput = document.getElementById('diaryTitle');
      const contentInput = document.getElementById('diaryContent');
      const editorTitle = document.getElementById('editorTitle');
      const saveBtn = document.getElementById('saveBtn');
      const cancelBtn = document.getElementById('cancelBtn');
      const newBtn = document.getElementById('newEntryBtn');
      const diaryCountEl = document.getElementById('diaryCount');
      const moodBtns = document.querySelectorAll('.mood-btn');

      let entries = [];
      let editingId = null;
      let selectedMood = '✨';

      // Load
      function load() {
        try { entries = JSON.parse(localStorage.getItem(STORAGE) || '[]'); }
        catch { entries = []; }
        entries.sort((a,b) => b.timestamp - a.timestamp);
        render();
      }

      function save() { localStorage.setItem(STORAGE, JSON.stringify(entries)); }

      function render() {
        diaryCountEl.textContent = entries.length;
        if (entries.length === 0) {
          listEl.innerHTML = `
            <div class="empty-state">
              <div class="empty-state__emoji">📔</div>
              <p>还没有写过日记呢</p>
              <p style="font-size:.85rem;margin-top:.5rem">点上面的按钮开始吧～</p>
            </div>`;
          return;
        }
        listEl.innerHTML = entries.map(e => `
          <div class="diary-item ${e.id === editingId ? 'active' : ''}" data-id="${e.id}">
            <div class="diary-item__date">${formatDate(e.timestamp)} ${e.mood || ''}</div>
            <div class="diary-item__title">${escapeHtml(e.title || '(无标题)')}</div>
            <div class="diary-item__preview">${escapeHtml((e.content || '').substring(0, 80))}</div>
            <div class="diary-item__actions">
              <button class="diary-item__del" data-del="${e.id}">删除</button>
            </div>
          </div>
        `).join('');

        listEl.querySelectorAll('.diary-item').forEach(el => {
          el.addEventListener('click', e => {
            if (e.target.hasAttribute('data-del')) {
              e.stopPropagation();
              const id = e.target.getAttribute('data-del');
              if (confirm('确定删除这篇日记吗？')) {
                entries = entries.filter(x => x.id !== id);
                save();
                if (editingId === id) resetEditor();
                render();
              }
              return;
            }
            openEditor(el.dataset.id);
          });
        });
      }

      function formatDate(ts) {
        const d = new Date(ts);
        const mm = String(d.getMonth()+1).padStart(2,'0');
        const dd = String(d.getDate()).padStart(2,'0');
        const hh = String(d.getHours()).padStart(2,'0');
        const mi = String(d.getMinutes()).padStart(2,'0');
        return `${mm}.${dd} ${hh}:${mi}`;
      }

      function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function openEditor(id) {
        const e = entries.find(x => x.id === id);
        if (!e) return;
        editingId = id;
        editorTitle.textContent = '编辑日记';
        titleInput.value = e.title || '';
        contentInput.value = e.content || '';
        selectedMood = e.mood || '✨';
        updateMoodBtns();
        render();
        titleInput.focus();
      }

      function resetEditor() {
        editingId = null;
        editorTitle.textContent = '新建日记';
        titleInput.value = '';
        contentInput.value = '';
        selectedMood = '✨';
        updateMoodBtns();
        render();
      }

      function updateMoodBtns() {
        moodBtns.forEach(b => {
          b.classList.toggle('active', b.dataset.mood === selectedMood);
        });
      }

      // Events
      newBtn?.addEventListener('click', resetEditor);
      cancelBtn?.addEventListener('click', resetEditor);

      moodBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          selectedMood = btn.dataset.mood;
          updateMoodBtns();
        });
      });

      saveBtn?.addEventListener('click', () => {
        const title = titleInput.value.trim();
        const content = contentInput.value.trim();
        if (!title && !content) {
          alert('写点什么再保存吧～');
          return;
        }
        if (editingId) {
          const e = entries.find(x => x.id === editingId);
          if (e) {
            e.title = title;
            e.content = content;
            e.mood = selectedMood;
            e.timestamp = Date.now();
          }
        } else {
          entries.unshift({
            id: 'entry-' + Date.now(),
            title, content, mood: selectedMood,
            timestamp: Date.now()
          });
        }
        save();
        resetEditor();
      });

      load();
    })();
  </script>
</body>
</html>
